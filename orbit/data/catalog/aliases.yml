    - "44422 decayed 2024-06-21 (all three sources agree); 44424 is still in orbit, CelesTrak 471 x 527 km at 97.58 deg"
    - "GCAT's payload notes differ by number: 44422 'Naprazheniye No. 2?', 44424 'Nivelir No. 5?' (both marked uncertain)"
  added_by: tic-analyst
  added: 2026-11-26

