# Cosmos 2535 to 2538 (2019-039, launched 2019-07-10, Plesetsk): Space-Track and CelesTrak name 44422, 44423 and
# 44424 COSMOS 2536, 2537 and 2538; GCAT names them Kosmos-2537, 2538 and 2536. Nothing Orbit holds settles which
# number carries which name (no orbit history for 2019-2020, when SWF's rows place Cosmos 2536 beside Cosmos 2535),
# so SWF's "Cosmos 2536" stays unlinked and the three names are recorded as open swaps.

- swap: "Cosmos 2536"
  claims:
    - {source: space-track, read: 2026-11-26, norad: 44422, as: "COSMOS 2536"}
