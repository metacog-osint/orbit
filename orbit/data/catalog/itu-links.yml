# The four Blagovest satellites (Russia). Russia filed BV-SAT-12E, -45E, -70E and -128E, each notified and brought
# into use. No source read states that BV stands for Blagovest or that these filings are the satellites'; the link
# rests on the slots: each satellite sits within 0.1 deg of one filing's nominal longitude, and no other Russian
# filing has a Resolution 40 in-position statement at that slot. Orbit's GEO record starts 1 Jul 2026 and gives only
# the current slot; earlier arrival dates were not read, and the ITU in-position dates are later than the launches,
# so they are the administration's declaration dates, not arrival dates.
- norad: 42907
  network: "BV-SAT-45E"
  adm: RUS
  slot: 45
  ntc_id: 120500268
  basis: by-hand
  evidence:
    - "Orbit's GEO record (read 27 Nov 2026): COSMOS 2520 (Blagovest 11L, names from GCAT and Wikidata) holding 45.0 E from 1 Jul 2026 to now (its held-the-slot list: within 0.5 deg for 7 days or more, mean longitude given)"
    - "ITU Space Explorer notice 120500268, BV-SAT-45E, Russian Federation, notification (11.2) received 2021-08-03; Master Register yes, brought into use yes (full, 110/110 groups), not suspended"
    - "ITU Resolution 40 table: BV-SAT-45E in position at 45 E from 29.12.2020; the station left 45 E on 01.10.2023 for IRANSAT-43.5E and IRANSAT-B-43.5E (Iran), in position 06.10.2023"
    - "Contradiction to resolve: Orbit's record shows COSMOS 2520 at 45 E now, 3 years after ITU's departure statement, and the filing remains active. The departed station may be another satellite, or Russia's statement may not describe a physical move. Read element-set history for 2023 before review."
  proposed_by: claude-code
  proposed: 2026-11-28

