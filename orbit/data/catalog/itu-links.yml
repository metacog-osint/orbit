# TIC satellite catalog: ITU satellite network filings linked to NORAD numbers by review (method orbit-2.42,
# doctrine/itu-filings.md). Read by orbit/itu.py (load_links); the build writes the reviewed entries to
# site/data/itu-links.json for the object pages.
#
# The ITU gives no NORAD number and no satellite name for a filing. A network name ("EUTELSAT 3-12.5W") is the
# administration's label for a filing, not a satellite's name, and a filing for a slot is a claim to orbit position
# and spectrum, not evidence that a satellite is there. So every entry here is TIC's attribution, with its evidence,
# and the network name never becomes one of the object's names in the catalog.
#
# One entry per link from one filing to one object:
#   norad, network (ITU's sat_name, as ITU gives it), adm (ITU's administration code), org (ITU's ntwk_org, if any),
#   slot (the filing's nominal longitude, degrees east, west negative), ntc_id (ITU's notice id, if known),
#   from / to (the dates the object served the filing, when the evidence gives them: a satellite moves between
#   filings and slots), basis, evidence (a list of statements, each with its source and link), proposed_by, proposed.
# basis: declared (an operator's or administration's own document names both the satellite and the filing),
#   res40-dates (the Resolution 40 in-position or departure dates match this object's own move in public element
#   sets), by-hand.
# ONLY ENTRIES WITH `reviewed_by` AND `reviewed` REACH A PAGE: a person adds both after checking the entry by diff.
# Never edit an entry to change its number: add `withdrawn: <date>` and `reason`, and add a new entry.
#
# Source: ITU Space Explorer and the ITU-R Resolution 40 table, (c) ITU, used for non-commercial research with the
# source acknowledged (itu.int terms of use). `python tools/orbit.py find <slot> --itu` lists a slot's filings and
# Resolution 40 statements locally for a reviewer.

# Proposed 28 Nov 2026, none reviewed. Every statement below was read on that date (UTC) unless it says otherwise.

# 33459. ITU records read: Space Explorer notice list, regulatory status and the Resolution 40 table. The satellite's
# own dates come from Eutelsat's registration documents (see the alias entry for 33459 in aliases.yml).
- norad: 33459
  network: "EUTELSAT 3-12.5W"
  adm: F
  org: EUT
  slot: -12.5
  ntc_id: 99500228
  from: 2023-06-19
  to: 2025-10-29
  basis: by-hand
  evidence:
    - "Eutelsat Universal Registration Document 2022-23, p. 26, as cited in orbit PR 41 (not re-read for this entry): Hot Bird 13C (HB9) moved to 12.5 W as 12 West G and was commissioned there on 19 Jun 2023"
    - "ITU Space Explorer regulatory status of EUTELSAT 3-12.5W (notice 99500228, France/EUT; Master Register: yes; brought into use: yes, full): suspended in full (256/256 groups), both suspension dates 29.10.2025"
    - "ITU Resolution 40 table: the station of F-SAT-N-E-13E left 12.5 W on 29.10.2025 (its row names 12.5 W as the previous position)"
    - "Eutelsat Universal Registration Document 2025-26, p. 26 and p. 30: EUTELSAT 50WA (previously EUTELSAT 12WG) relocated and declared operational at 50.3 W on 19 Dec 2025, for a third-party operator"
    - "Inferred, not stated by ITU or Eutelsat: that 33459 is the station that left on 29.10.2025. The filing was brought into use in 1999 and 2003 (ITU in-use dates 09.08.1999 and 15.09.2003), so other satellites served it before. The 'from' date is the commissioning date in Eutelsat's document and the 'to' date is ITU's suspension date. No element-set history was read for the departure."
  proposed_by: claude-code
  proposed: 2026-11-28

- norad: 33459
  network: "NEW DAWN 35-1"
  adm: PNG
  slot: -50
  from: 2025-12-16
  basis: by-hand
  evidence:
    - "ITU Resolution 40 table: NEW DAWN 35-1 (Papua New Guinea) in position at 50 W from 16.12.2025 (notification for the Master Register, 11.2); the station came from 12.5 W, filing F-SAT-N-E-13E, left 29.10.2025"
    - "ITU Space Explorer: NEW DAWN 35-1 has a coordination request (9.6) received 2019-05-14 (notice 119520134) and a Resolution 49 due diligence record received 2026-01-13 (notice 126590003); Resolution 49 spacecraft details are behind an ITU login and were not read"
    - "Eutelsat Universal Registration Document 2025-26, p. 26: EUTELSAT 50WA (formerly EUTELSAT 12 WEST G) positioned at 50.3 W and in operational service for a third-party operator on 19 Dec 2025, three days after ITU's in-position date"
    - "Orbit's GEO record (read 27 Nov 2026): 33459 holds 50.2 W. No source read names Papua New Guinea or New Dawn as the third-party operator; that is inferred from the slot and the dates."
  proposed_by: claude-code
  proposed: 2026-11-28
  note: "The administration filing the notification is Papua New Guinea; the satellite is Eutelsat's. Intelsat has asked the FCC to relicense it (Advanced Television, 3 Feb 2026), which this entry does not rely on."

