# TIC satellite catalog: WMO OSCAR/Space slug-to-NORAD links (Tom, 17 Nov 2026; design note
# D:/Projects/_ideas/sat-catalog-design-2026-11.md, section 9 answer 8). Read by orbit/oscarlinks.py.
#
# OSCAR gives no NORAD number and no COSPAR ID. Each entry links one OSCAR satellite (its slug) to the object it is
# (`norad`), the objects it stands for (`members`), or the object that carries it (`relation: hosted`), with the
# evidence. `tools/orbit.py oscar-propose --draft` proposes entries from launch date and orbit only; the names in the
# evidence are for the reviewer. ONLY ENTRIES WITH `reviewed_by` AND `reviewed` JOIN THE CATALOG: a person adds both
# after checking the entry by diff. Never edit an entry to change its number: add `withdrawn: <date>` and `reason`,
# and add a new entry.
#
# OSCAR read 18 Nov 2026 (space.oscar.wmo.int/api/v1/satellites, 36 pages, 1,062 satellites, 414 operational);
# candidates from CelesTrak's SATCAT file of 16 Nov 2026 20:34 UTC; names beside them from the TIC name index of
# 18 Nov 2026 (release `catalog`). Credit: WMO OSCAR/Space, courtesy of the World Meteorological Organization.

