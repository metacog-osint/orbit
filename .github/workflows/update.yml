name: update
# DRAFT, 13 Nov 2026: written and not yet run. It does nothing until it is on main, and it deploys nothing until
# Tom creates the Cloudflare Pages project `orbit` and sets the secrets below. Copied from Headwind's update.yml.
#
# Four times a day (meant to be started by the hub's tic-dispatch Worker, because GitHub fires schedules 4-9 h
# late; its own cron is the fallback), on every push to main, and by hand: the tests, the last run's state from
# this repository's Actions cache, a live collection, the site build and feed check, then a deploy of site/ to
# Cloudflare Pages.
#
# Load on sources: GCAT republishes about once a day, at no fixed time, from Jonathan McDowell's own server. The catalog
# lane asks each file's Last-Modified date first and downloads nothing (about 37 MB otherwise) unless one has
# changed, so only the first run after his update downloads. Never add --force here. Launch Library 2 is one
# request a run (free limit 15 an hour).
#
# State: Orbit reports catalog changes as the difference between two of its own readings, skips GCAT when it has
# not changed, and a failed lane keeps its last good copy. All three need the run before: data/snapshot.json and
# data/state/catalog_index.json.gz (about 1.3 MB). They are kept in the Actions cache, which is private to this
# repository. Each run saves a new cache entry and the next run restores the newest. GitHub drops an entry nobody
# has read for 7 days; with no entry a run is a first reading, sets the baseline, reports no catalog change and
# says so in a warning. State is saved after the feed check and before the deploy, so a failed deploy does not
# lose a change.
#
# Secrets: CLOUDFLARE_PAGES_TOKEN (Cloudflare Pages: Edit), and the account ID as repo variable
# CLOUDFLARE_ACCOUNT_ID. Without them everything runs except the deploy. Collected data is not committed.
#
# Space-Track (manoeuvre lane, orbit-2.4): SPACETRACK_IDENTITY, SPACETRACK_PASSWORD and ORBIT_WATCH (the private
# watch list, NORAD numbers comma-separated), set by Tom. Given to the collect step only, never to the tests.
# Without them the lane is off and nothing else changes. GP is read at most once an hour; a run that reaches
# Space-Track at :57-:03 or :27-:33 waits for a clear minute (up to about 7 minutes), as Space-Track asks.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Last run's state from the Actions cache (none on the first run)
        id: state
        uses: actions/cache/restore@v6
        with:
          path: |
            data/snapshot.json
            data/state
          key: orbit-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: orbit-state-
      - name: Say so when there was no state
        if: steps.state.outputs.cache-matched-key == ''
        run: echo "::warning::No state in the Actions cache, so this run is a first reading and can report no catalog change."
      - name: Live collection (a failed lane keeps its last good copy and says so on the page)
        env:
          SPACETRACK_IDENTITY: ${{ secrets.SPACETRACK_IDENTITY }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
          ORBIT_WATCH: ${{ secrets.ORBIT_WATCH }}
          # reads geo.yml's runs: it shares the Space-Track account's hourly GP query (orbit-2.8; Noisefloor dropped, orbit-2.21)
          GH_TOKEN: ${{ github.token }}
        run: python tools/orbit.py collect
      - name: Build site/
        env:
          # the globe's public Cesium ion token (read-only, restricted to Orbit's hosts), written to data/cesium.json
          CESIUM_ION_TOKEN: ${{ vars.CESIUM_ION_TOKEN }}
        run: python tools/orbit.py build
      # The GEO page (geo.html; step 4 of doctrine/geo-move-plan.md, 18 Nov 2026): the globe's data and the callouts,
      # from this repository's public geo-YYYY releases (written by geo.yml; no Space-Track request here). numpy and
      # sgp4 only for this step (tools/requirements-callouts.txt). A failure leaves the page's loading text, never the
      # rest of the deploy.
      - name: Object pages (the catalog's shards and search index from release catalog; one request)
        run: python tools/orbit.py object-data
      - name: GEO page data and callouts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet -r tools/requirements-callouts.txt || { echo "::warning::GEO page skipped: pip install failed"; exit 0; }
          dir="$RUNNER_TEMP/geo"; mkdir -p "$dir"; year=$(date -u +%Y)
          for tag in "geo-$((year - 1))" "geo-$year"; do
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "*.geo-region.json" -p "geo-elements-*.json.gz" -D "$dir" --clobber 2>/dev/null || echo "no release $tag"
          done
          python tools/geo_page.py build "$dir" site --snapshot data/snapshot.json || echo "::warning::GEO page data skipped; the page shows its loading text"
          python tools/geo_callouts.py publish --data "$dir" --out site/data/geo/callouts.json || echo "::warning::GEO callouts skipped; the globe shows none"
      - name: Feed check
        run: python tools/orbit.py check
      - name: Keep this run's state for the next run
        uses: actions/cache/save@v6
        with:
          path: |
            data/snapshot.json
            data/state
          key: orbit-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          npx --yes wrangler@4.151.3 pages deploy site --project-name orbit --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "update $GITHUB_SHA" --commit-dirty=true
