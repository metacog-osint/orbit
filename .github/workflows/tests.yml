name: tests
# Runs the unit tests of update.yml, then build and check, on every pull request to main, so a PR has a check
# to read at its head sha. The build reads the committed snapshot in site/data; nothing is collected.
# No secrets, no deploy, no release writes, and a read-only token.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build and check
        run: |
          mkdir -p data
          cp site/data/snapshot.json data/snapshot.json
          python tools/orbit.py build
          python tools/orbit.py check
