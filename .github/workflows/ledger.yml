name: ledger
# Retired in orbit-2.32 (25 Nov 2026, ideas#69): the launch ledger moved to the suite's Launch program, which reads
# Launch Library 2 itself (launch.theintelligence.company; its release `ledger`, ll2-ledger.json). Orbit's last
# launch-ledger.json stays on this repository's release `ledger`, frozen, with a "moved to Launch" note.
#
# It has no schedule of its own and does nothing; it remains while the suite's tic-dispatch Worker still starts
# it at :45 past the hour.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Moved to Launch
        run: echo "::notice::Orbit's launch ledger moved to Launch (ideas#69); nothing to do here."
