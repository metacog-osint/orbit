name: geo-import
# One time, by hand: Noisefloor's GEO region history (its public pnt-data-YYYY-MM releases, July 2026 on) into Orbit's
# public releases geo-YYYY (tools/geo_import.py; step 2 of doctrine/geo-move-plan.md). No Space-Track request.
# Run it before geo.yml's first run, so that run has yesterday's file and lists events.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyarrow==22.0.0
      - name: Import and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/geo_import.py --upload
