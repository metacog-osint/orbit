name: catalog
# TIC's satellite catalog (orbit/catalog.py, orbit/stcat.py, orbit/catsources.py; build steps 3-4, Tom's yes 17 Nov
# 2026): one Space-Track read a day (class satcat, class decay; 4 requests), and in that same run CelesTrak's SATCAT
# (a directory check, and the file only when it changed: at most once a day) and Wikidata (one SPARQL query a week),
# then GCAT's catalogs; the catalog built and uploaded with the decay store to this repository's public release
# `catalog`.
#
# Space-Track's use policy (read 17 Nov 2026): SATCAT "Once per day after 1700 (UTC)"; DECAY once a day, and an
# object's decay history is stored and never downloaded again. Those rows are SATCAT's and DECAY's own, so GP's hourly
# rule (and the shared-account gp checks in geo.yml and update.yml) does not apply. `stcat.due` allows one read per
# UTC date from 17:00 UTC, the state riding the release, so the three starts below make at most one read; GitHub
# fires this account's schedules hours late, and a start after midnight UTC waits for the next day.
#
# CelesTrak's usage policy (updated 16 Nov 2026, read 17 Nov): one download per update, directory queries at most
# hourly, stop on any answer but 200 and tell a person. A refusal puts that source on hold (state on the release) and
# fails the run after the upload; once a person has looked, start this workflow by hand with `clear_hold`.
# CelesTrak's and Wikidata's last replies ride the Actions cache (private); if it is evicted, each is read once more.
#
# Private archive (metacog-osint/tic-archive, tools/tic_archive.py; dated snapshots, nothing replaced there). The
# release `catalog` keeps only its newest files, so every version goes to the archive, lane catalog-release: the
# release's files as they are before a due read replaces them (a failure stops the run before Space-Track is read)
# and the files just uploaded. The run's raw replies (Space-Track SATCAT and DECAY, CelesTrak, Wikidata, WMO
# OSCAR/Space; not GCAT's tables) go to lane catalog-raw after the catalog step, even when it failed. Token:
# TIC_ARCHIVE_TOKEN, contents:write on tic-archive only, handed to tic_archive.py alone.
on:
  schedule:
    - cron: "23 17,19,21 * * *"
  workflow_dispatch:
    inputs:
      clear_hold:
        description: "Clear a source's hold (only after a person has looked at the refusal)"
        type: choice
        options: ["", "celestrak-satcat", "wikidata"]
        default: ""
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Catalog tests
        run: python -m unittest tests.test_catalog tests.test_stcat tests.test_catsources tests.test_catshards tests.test_oscar tests.test_archive_lanes tests.test_debrismap
      - name: CelesTrak and Wikidata replies from the Actions cache (none on the first run)
        uses: actions/cache/restore@v6
        with:
          path: |
            data/state/celestrak-satcat.csv.gz
            data/state/wikidata-p377.json.gz
          key: catalog-sources-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-sources-
      - name: WMO OSCAR/Space's last satellite list from the Actions cache (none on the first run)
        uses: actions/cache/restore@v6
        with:
          path: data/state/wmo-oscar-satellites.json.gz
          key: catalog-oscar-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-oscar-
      - name: Catalog (Space-Track SATCAT and DECAY, CelesTrak SATCAT, Wikidata, WMO OSCAR/Space, GCAT)
        env:
          GH_TOKEN: ${{ github.token }}
          SPACETRACK_IDENTITY: ${{ secrets.SPACETRACK_IDENTITY }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
          CLEAR_HOLD: ${{ inputs.clear_hold }}
          TIC_ARCHIVE_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
        run: python tools/orbit.py spacetrack-catalog --release ${CLEAR_HOLD:+--clear-hold "$CLEAR_HOLD"}
      # The satellite map's rocket bodies and debris (orbit/debrismap.py, orbit-2.51): one Space-Track GP query a UTC
      # day, the account's third GP query. It waits for the update run's and geo.yml's (spacetrack.FOR_DEBRIS), and they
      # wait for this step by its name, so the name is held in orbit/spacetrack.py (CATALOG_STEP); rename both together.
      # Not due or not clear: a notice, and the last file stays on release `catalog`.
      - name: Rocket bodies and debris (Space-Track GP, once a day)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SPACETRACK_IDENTITY: ${{ secrets.SPACETRACK_IDENTITY }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: python tools/orbit.py debris-gp
      - name: Keep WMO OSCAR/Space's list for the next run
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: data/state/wmo-oscar-satellites.json.gz
          key: catalog-oscar-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep CelesTrak's and Wikidata's replies for the next run
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: |
            data/state/celestrak-satcat.csv.gz
            data/state/wikidata-p377.json.gz
          key: catalog-sources-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Private archive (the catalog run's raw replies, to tic-archive)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
        run: |
          if [ -z "$(find data/raw -type f ! -path 'data/raw/gcat-*' 2>/dev/null | head -n 1)" ]; then
            echo "catalog-raw: no reply was read this run"; exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so this run's raw replies did not reach the private archive"; exit 1
          fi
          python tools/tic_archive.py put --program orbit --lane catalog-raw --src data/raw --exclude 'gcat-*'
